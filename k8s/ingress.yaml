# Assumes an ingress-nginx (or compatible) controller and cert-manager are
# already installed in the cluster. Adjust the class name / annotations to
# match your ingress controller if different.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ewos-backend
  namespace: ewos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
      secretName: ewos-backend-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ewos-backend
                port:
                  number: 80
