apiVersion: apps/v1
kind: Deployment
metadata:
  name: ewos-backend
  namespace: ewos
  labels:
    app: ewos-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ewos-backend
  template:
    metadata:
      labels:
        app: ewos-backend
    spec:
      # Matches the fixed UID/GID baked into the Dockerfile's runtime stage.
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      # Must exceed spring.lifecycle.timeout-per-shutdown-phase (30s) plus the preStop sleep
      # below, so Kubernetes never SIGKILLs the process while it's still draining gracefully.
      terminationGracePeriodSeconds: 45
      containers:
        - name: ewos-backend
          image: ghcr.io/buntychavan-web/ewos:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: ewos-backend-config
            - secretRef:
                name: ewos-backend-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          lifecycle:
            preStop:
              # Gives the readiness probe time to fail and propagate pod removal from the
              # Service's endpoint list before Tomcat stops accepting connections — otherwise
              # a rolling update can route a new request to a pod that's already draining.
              exec:
                command: ["sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
