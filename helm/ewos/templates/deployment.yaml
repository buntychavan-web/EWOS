apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ewos.fullname" . }}
  labels:
    {{- include "ewos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ewos.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ewos.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      # Must exceed spring.lifecycle.timeout-per-shutdown-phase (30s) plus the preStop sleep
      # below, so Kubernetes never SIGKILLs the process while it's still draining gracefully.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 45 }}
      containers:
        - name: {{ include "ewos.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "ewos.fullname" . }}-config
            - secretRef:
                name: {{ include "ewos.fullname" . }}-secret
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          lifecycle:
            preStop:
              # Gives the readiness probe time to fail and propagate pod removal from the
              # Service's endpoint list before Tomcat stops accepting connections — otherwise
              # a rolling update can route a new request to a pod that's already draining.
              exec:
                command: ["sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
