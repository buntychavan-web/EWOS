replicaCount: 2

image:
  repository: ghcr.io/buntychavan-web/ewos
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: api.example.com
  tlsSecretName: ewos-backend-tls

# Non-secret configuration. Mirrors k8s/configmap.yaml — see .env.example
# for what each variable does.
config:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  DB_POOL_MAX: "20"
  DB_POOL_MIN: "5"
  REDIS_HOST: "ewos-redis"
  REDIS_PORT: "6379"
  APP_MESSAGING_KAFKA_ENABLED: "false"
  JWT_ISSUER: "ewos"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_TTL: "7d"
  ADMIN_USERNAME: "admin"
  ADMIN_EMAIL: "admin@ewos.local"
  PASSWORD_MIN_LENGTH: "8"
  PASSWORD_MAX_LENGTH: "128"
  PASSWORD_REQUIRE_UPPERCASE: "true"
  PASSWORD_REQUIRE_LOWERCASE: "true"
  PASSWORD_REQUIRE_DIGIT: "true"
  PASSWORD_REQUIRE_SPECIAL: "true"
  PASSWORD_HISTORY_SIZE: "5"
  AUTH_LOCKOUT_ENABLED: "true"
  AUTH_LOCKOUT_MAX_ATTEMPTS: "5"
  AUTH_LOCKOUT_DURATION: "15m"
  AUTH_RATELIMIT_ENABLED: "true"
  AUTH_RATELIMIT_MAX_ATTEMPTS: "60"
  AUTH_RATELIMIT_WINDOW: "1m"
  APP_CORS_ALLOWED_ORIGINS: "https://app.example.com"
  APP_CORS_ALLOW_CREDENTIALS: "true"
  APP_CORS_MAX_AGE: "1h"
  APP_PURGE_ENABLED: "false"

# Secret values — leave empty here and supply via `--set secrets.X=...`,
# `-f secrets.yaml` (gitignored), or --set-file at install time. Never commit
# real values into this file.
secrets:
  SPRING_DATASOURCE_URL: ""
  SPRING_DATASOURCE_USERNAME: ""
  SPRING_DATASOURCE_PASSWORD: ""
  JWT_SECRET: ""
  ADMIN_PASSWORD: ""
